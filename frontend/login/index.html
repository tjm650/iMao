<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101827">
  <title>Connect | iMao</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <main class="shell">
    <section class="panel">
      <div class="brand-mark">i</div>
      <p class="eyebrow">WI-FI ACCESS</p>
      <h1>Welcome to iMao</h1>
      <p class="muted">Enter your access voucher to get online. Your connection activates as soon as your voucher is verified.</p>

      <form id="voucher-form">
        <label for="voucher">Voucher code</label>
        <input id="voucher" name="voucher" autocomplete="one-time-code" autocapitalize="characters" spellcheck="false"
               inputmode="text" maxlength="19" placeholder="XXXX-XXXX-XXXX-XXXX" aria-describedby="voucher-help" required>
        <p id="voucher-help" class="field-help">Enter the 16-character code printed on your access voucher.</p>
        <button type="submit">Connect to internet</button>
        <p id="message" class="message" role="status" aria-live="polite"></p>
      </form>
      <p class="fine-print">Your access is subject to your voucher's data allowance and validity.</p>
    </section>
  </main>
  <script src="/static/app.js"></script>
</body>
</html>
